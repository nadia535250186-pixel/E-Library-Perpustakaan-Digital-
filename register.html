<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">
        <div class="login-box">
            <h1>Register</h1>
            <p>Buat akun baru</p>

            <form id="registerForm">
                <label for="name">Nama Lengkap</label>
                <input type="text" id="name" placeholder="Masukkan nama lengkap">

                <label for="registerEmail">Email</label>
                <input type="email" id="registerEmail" placeholder="Masukkan email">

                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" placeholder="Masukkan password">

                <label for="confirmPassword">Konfirmasi Password</label>
                <input type="password" id="confirmPassword" placeholder="Ulangi password">

                <button type="submit">Daftar</button>
            </form>

            <p class="register-text">
                Sudah punya akun?
                <a href="login.html">Login</a>
            </p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
