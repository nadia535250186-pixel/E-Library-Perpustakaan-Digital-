<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme-brown.css">
</head>

<body>

    <div class="login-container">
        <div class="login-box">
            <h1>Login</h1>
            <p>Silakan masuk ke akun Anda</p>

            <form id="loginForm">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Masukkan email" autocomplete="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" required>

                <button type="submit">Login</button>
            </form>

            <p class="register-text">
                Belum punya akun?
                <a href="register.html">Register</a>
            </p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
